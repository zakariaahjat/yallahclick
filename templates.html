<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design Templates — YallahClick Library</title>
<link rel="icon" type="image/x-icon" href="images/Mini logo.ico">
<meta name="description" content="Editable design templates for Photoshop, Canva, Figma, After Effects and more.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/shared.css">
<link rel="stylesheet" href="css/public-pages.css">
</head>
<body data-public-page data-active-link="templates.html" data-promo-auto data-library="templates">

  <section class="page-hero">
    <div class="wrap">
      <span class="overline" style="color:var(--red)">Library / Design Templates</span>
      <h1 class="display">Design<br><span class="stroke">Templates</span> <span class="red-fill shimmer">&amp; Packs</span></h1>
      <p class="sub">Drag-and-drop, edit, export. Thumbnail PSDs, Canva kits, Figma brand systems and LUT packs built to hold the YallahClick standard.</p>
      <div class="hero-count" id="heroCount"></div>
    </div>
  </section>

  <main class="page-main">
    <div class="wrap">
      <div class="lib-tools">
        <div class="row">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="libSearch" placeholder="Search templates…">
          </div>
          <div class="seg-control" id="libSort">
            <button type="button" class="active" data-sort="popular">Popular</button>
            <button type="button" data-sort="newest">Newest</button>
            <button type="button" data-sort="title">A–Z</button>
          </div>
        </div>
        <div class="filters-row">
          <select class="select-filter" id="libCategory"></select>
        </div>
      </div>
      <div class="lib-grid featured" id="libFeatured"></div>
      <div class="lib-grid" id="libGrid" style="margin-top:22px"></div>
    </div>
  </main>

  <div class="fav-tray" id="favTray"></div>

  <script src="js/shared.js"></script>
  <script src="data/services.js"></script>
  <script src="data/promotions.js"></script>
  <script src="data/templates.js"></script>
  <script src="services/storage.js"></script>
  <script src="services/promotionService.js"></script>
  <script src="services/templateService.js"></script>
  <script src="js/promo-popup.js"></script>
  <script src="js/library.js"></script>
  <script src="js/public.js"></script>
</body>
</html>
